<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="referrer" content="no-referrer"><title>Activar acceso · ELARA Transport</title>
 <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/buttons.css"><link rel="stylesheet" href="css/modals.css">
</head>
<body>
 <main class="modal__body">
  <h1>Activar acceso al portal</h1>
  <p id="invite-status" role="status" aria-live="polite">Comprobando invitación…</p>
  <form id="invite-form" hidden>
   <label>Nueva contraseña<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
   <label>Confirmar contraseña<input name="confirmation" type="password" autocomplete="new-password" minlength="12" required></label>
   <button type="submit">Establecer contraseña y entrar</button>
  </form>
  <button id="invite-retry" type="button" hidden>Revisar acceso preparado por Administración</button>
  <a href="index.html">Volver al inicio de sesión</a>
 </main>
 <!-- Capture invitation context before Auth can consume and clear the URL. -->
 <script src="js/accept-invite.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
 <script src="js/config.js"></script><script src="js/supabase.js"></script>
</body>
</html>
